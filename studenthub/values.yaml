auth:
  replicas: 1
  containerPort: 8080
  image:
    repository: mariaac53695/studenthub-auth
    tag: "1.0"
    pullPolicy: IfNotPresent

business:
  replicas: 1
  containerPort: 8080
  image:
    repository: mariaac53695/studenthub-business
    tag: "1.0"
    pullPolicy: IfNotPresent

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  storage:
    size: 10Gi

  credentials:
    username: master
    password: masterpass

  databases:
    auth: auth_db
    business: business_db

